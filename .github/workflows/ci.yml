name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: test-key-do-not-use
      USE_RERANKER: "false"
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import check
        run: python -c "import app"
      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to Hugging Face Space
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ] || [ -z "${{ secrets.HF_SPACE_ID }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::notice ::Skipping deploy — HF_TOKEN or HF_SPACE_ID secret is not set."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.missing == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.secrets.outputs.missing == 'false'
        name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          git config --global user.email "ci@zidipay.example"
          git config --global user.name "Zidipay CI"
          # HF_SPACE_ID is in the form "username/spacename"
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push --force space HEAD:main
